# CI SonarCloud scan — uses sonar-project.properties.
# Uses SONAR_TOKEN when set; falls back to GITHUB_TOKEN (SonarCloud GitHub binding).
name: SonarCloud

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: sonar-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - id: token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::add-mask::${{ secrets.SONAR_TOKEN }}"
            echo "value=${{ secrets.SONAR_TOKEN }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ steps.token.outputs.value }}
